[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehds-desk"
version = "0.1.0"
description = "EHDS Access Desk: decides EU health-data access requests and computes privacy-safe statistics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0",
    "pydantic>=2.10",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
llm = ["anthropic"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
