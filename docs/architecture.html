<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AccessDesk architecture</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f5f5f5; color: #2d3142; }
    body { font-family: Geist, system-ui, sans-serif; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; min-width: 1360px; width: 1360px; height: auto; }
    .title { font: 400 32px "Instrument Serif", Georgia, serif; fill: #2d3142; }
    .subtitle { font: 400 14px Geist, system-ui, sans-serif; fill: #4f5d75; }
    .node-title { font: 600 17px Geist, system-ui, sans-serif; fill: #2d3142; }
    .node-body { font: 400 13px Geist, system-ui, sans-serif; fill: #2d3142; }
    .node-mono { font: 400 11px "Geist Mono", ui-monospace, monospace; fill: #4f5d75; }
    .output-body { font: 500 13px Geist, system-ui, sans-serif; fill: #2d3142; }
    .rail-label { font: 600 14px Geist, system-ui, sans-serif; fill: #2d3142; }
    .rail-detail { font: 400 12px Geist, system-ui, sans-serif; fill: #4f5d75; }
    .legend { font: 400 11px "Geist Mono", ui-monospace, monospace; fill: #4f5d75; }
    .data-label { font: 500 13px Geist, system-ui, sans-serif; fill: #2d3142; }
    .data-kicker { font: 500 10px "Geist Mono", ui-monospace, monospace; fill: #5a6580; letter-spacing: .08em; }
    .node { fill: #ffffff; stroke: #2d3142; stroke-width: 1; rx: 6; }
    .input-node { fill: rgba(79,93,117,.10); stroke: #5a6580; }
    .output-node { fill: rgba(191,69,32,.08); stroke: #bf4520; stroke-width: 1.2; }
    .optional-node { fill: rgba(45,49,66,.02); stroke: rgba(45,49,66,.40); stroke-width: 1; stroke-dasharray: 4,3; }
    .audit-node { fill: rgba(45,49,66,.05); stroke: #4f5d75; stroke-width: 1; }
    .flow { fill: none; stroke: #4f5d75; stroke-width: 1.2; marker-end: url(#architecture-arrow); }
    .optional-flow { fill: none; stroke: #5a6580; stroke-width: 1; stroke-dasharray: 4,3; marker-end: url(#architecture-arrow-muted); }
    .audit-tap { fill: none; stroke: #5a6580; stroke-width: .8; }
    .audit-rail { fill: none; stroke: #4f5d75; stroke-width: 1; }
    .rule { fill: none; stroke: rgba(45,49,66,.12); stroke-width: 1; }
  </style>
</head>
<body>
  <main class="diagram-container">
    <svg xmlns="http://www.w3.org/2000/svg" role="img"
      aria-labelledby="architecture-title architecture-desc"
      viewBox="0 0 1360 820" width="1360" height="820"
      style="min-width:1360px">
      <title id="architecture-title">AccessDesk architecture</title>
      <desc id="architecture-desc">A request passes left to right through the Five Safes. Every safe writes to a hash-chained audit log; optional Claude sees request text only. Statistics, permits, letters, reviews and transparency entries leave through governed outputs.</desc>
      <defs>
        <marker id="architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/>
        </marker>
        <marker id="architecture-arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#5a6580"/>
        </marker>
      </defs>
      <rect x="0" y="0" width="1360" height="820" fill="#f5f5f5"/>

      <text class="title" x="36" y="52">AccessDesk architecture</text>
      <text class="subtitle" x="38" y="78">Five Safes · governed secondary use of health data</text>

      <path class="flow" d="M168 405 H190"/>
      <path class="flow" d="M346 405 H367"/>
      <path class="flow" d="M523 405 H544"/>
      <path class="flow" d="M754 405 H775"/>
      <path class="flow" d="M947 405 H968"/>
      <path class="flow" d="M1140 405 H1160"/>
      <path class="optional-flow" d="M98 350 V226 Q98 218 106 218 H956 Q964 218 964 210 V206"/>

      <path class="audit-tap" d="M268 520 V572"/>
      <path class="audit-tap" d="M445 520 V572"/>
      <path class="audit-tap" d="M649 520 V572"/>
      <path class="audit-tap" d="M861 520 V572"/>
      <path class="audit-tap" d="M1054 520 V572"/>

      <g aria-label="Optional Claude">
        <rect class="optional-node" x="810" y="112" width="510" height="94" rx="6"/>
        <text class="node-title" x="830" y="141">Optional Claude</text>
        <text class="node-body" x="830" y="165">Request text only · never patient data</text>
        <text class="node-body" x="830" y="188">Can only send a disagreement to staff review</text>
      </g>

      <g aria-label="Request JSON input">
        <rect class="node input-node" x="28" y="350" width="140" height="110" rx="6"/>
        <text class="node-title" x="42" y="386">Request JSON</text>
        <text class="node-mono" x="42" y="414">API · builder</text>
        <text class="node-mono" x="42" y="434">decide.py</text>
      </g>

      <g aria-label="Safe People">
        <rect class="node" x="190" y="310" width="156" height="210" rx="6"/>
        <text class="node-title" x="204" y="344">Safe People</text>
        <path class="rule" d="M204 360 H332"/>
        <text class="node-mono" x="204" y="386">people.py</text>
        <text class="node-body" x="204" y="418">Credentials</text>
        <text class="node-body" x="204" y="442">Ed25519 signatures</text>
      </g>

      <g aria-label="Safe Projects">
        <rect class="node" x="367" y="310" width="156" height="210" rx="6"/>
        <text class="node-title" x="381" y="344">Safe Projects</text>
        <path class="rule" d="M381 360 H509"/>
        <text class="node-mono" x="381" y="386">projects.py</text>
        <text class="node-body" x="381" y="418">Art. 54 / 53 rules</text>
        <text class="node-body" x="381" y="442">Fixed decision order</text>
      </g>

      <g aria-label="Safe Data">
        <rect class="node" x="544" y="292" width="210" height="228" rx="6"/>
        <text class="node-title" x="558" y="326">Safe Data</text>
        <path class="rule" d="M558 342 H740"/>
        <text class="node-body" x="558" y="370">Parser → QueryPlan</text>
        <text class="node-mono" x="558" y="390">Pydantic · terminology list</text>
        <text class="node-body" x="558" y="422">Compiler → DuckDB SQL</text>
        <text class="node-mono" x="558" y="450">Code list checked against data</text>
        <text class="node-body" x="558" y="482">Opt-outs removed at load</text>
      </g>

      <g aria-label="Safe Settings">
        <rect class="node" x="775" y="310" width="172" height="210" rx="6"/>
        <text class="node-title" x="789" y="344">Safe Settings</text>
        <path class="rule" d="M789 360 H933"/>
        <text class="node-body" x="789" y="388">SPE · DuckDB file</text>
        <text class="node-body" x="789" y="410">per permit</text>
        <text class="node-body" x="789" y="442">Read-only console</text>
        <text class="node-body" x="789" y="474">Download → HTTP 403</text>
      </g>

      <g aria-label="Safe Outputs">
        <rect class="node output-node" x="968" y="310" width="172" height="210" rx="6"/>
        <text class="node-title" x="982" y="344">Safe Outputs</text>
        <path class="rule" d="M982 360 H1126"/>
        <text class="node-body" x="982" y="388">Privacy gate</text>
        <text class="node-body" x="982" y="420">Differencing guard</text>
        <text class="node-body" x="982" y="452">Export review</text>
      </g>

      <g aria-label="Governed outputs">
        <rect class="node" x="1160" y="292" width="184" height="228" rx="6"/>
        <text class="node-title" x="1174" y="326">Outputs</text>
        <path class="rule" d="M1174 342 H1330"/>
        <text class="output-body" x="1174" y="370">Statistics answer</text>
        <text class="output-body" x="1174" y="398">Permit + SPE</text>
        <text class="output-body" x="1174" y="426">Formal letter · DE/EN</text>
        <text class="output-body" x="1174" y="454">Inbox / review</text>
        <text class="output-body" x="1174" y="482">Transparency register</text>
      </g>

      <g aria-label="Hash-chained audit log">
        <rect class="audit-node" x="190" y="572" width="950" height="68" rx="6"/>
        <text class="rail-label" x="212" y="600">Hash-chained audit log</text>
        <text class="rail-detail" x="212" y="621">SHA-256 previous-entry hash · every step writes</text>
      </g>

      <path class="rule" d="M36 668 H1344"/>
      <text class="legend" x="36" y="692">FLOW</text>
      <line class="flow" x1="86" y1="688" x2="126" y2="688"/>
      <text class="legend" x="138" y="692">REQUEST PATH</text>
      <line class="optional-flow" x1="258" y1="688" x2="298" y2="688"/>
      <text class="legend" x="310" y="692">OPTIONAL · REQUEST TEXT ONLY</text>
      <line class="audit-rail" x1="568" y1="688" x2="608" y2="688"/>
      <text class="legend" x="620" y="692">AUDIT WRITE</text>

      <text class="data-kicker" x="36" y="746">DATA LAYER</text>
      <text class="data-label" x="152" y="746">CSV → DuckDB analysis store · 839 opt-outs removed at load</text>
    </svg>
  </main>
</body>
</html>
